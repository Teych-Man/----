<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Софа, у меня к тебе вопрос 💌</title>
    <style>
        :root {
            --bg1: #1a0b2e;
            --bg2: #3b0f4f;
            --bg3: #7a1f5c;
            --pink: #ff5c9d;
            --soft: #ffd1e6;
            --text: #fff;
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html,
        body {
            height: 100%
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3), var(--bg2));
            background-size: 300% 300%;
            animation: bg 14s ease infinite;
            overflow: hidden;
            position: relative
        }

        @keyframes bg {
            50% {
                background-position: 100% 100%
            }
        }

        #hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden
        }

        .h {
            position: absolute;
            bottom: -40px;
            opacity: 0;
            animation: rise linear forwards
        }

        @keyframes rise {
            10% {
                opacity: .8
            }

            100% {
                transform: translateY(-110vh) rotate(40deg);
                opacity: 0
            }
        }

        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transform: scale(.9) translateY(30px);
            filter: blur(10px);
            transition: all .8s cubic-bezier(.2, .8, .2, 1)
        }

        .scene.on {
            opacity: 1;
            visibility: visible;
            transform: none;
            filter: none
        }

        h1 {
            font-size: clamp(2rem, 8vw, 3.6rem);
            line-height: 1.15;
            background: linear-gradient(90deg, #fff, var(--pink), #fff);
            background-size: 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 4s linear infinite
        }

        @keyframes shine {
            to {
                background-position: 200%
            }
        }

        p.sub {
            margin-top: 14px;
            color: var(--soft);
            font-size: 1.1rem
        }

        .big {
            font-size: 4rem;
            animation: beat 1.2s ease-in-out infinite
        }

        @keyframes beat {

            0%,
            100% {
                transform: scale(1)
            }

            15% {
                transform: scale(1.25)
            }

            30% {
                transform: scale(1)
            }

            45% {
                transform: scale(1.18)
            }
        }

        .btn {
            margin-top: 28px;
            border: 0;
            border-radius: 999px;
            padding: 14px 34px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--pink), #ff8a5c);
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255, 92, 157, .45);
            transition: transform .25s, box-shadow .25s
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05)
        }

        .card {
            max-width: 520px;
            min-height: 150px;
            padding: 30px 26px;
            border-radius: 24px;
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .25);
            backdrop-filter: blur(14px);
            font-size: clamp(1.2rem, 4.5vw, 1.6rem);
            display: flex;
            align-items: center;
            justify-content: center
        }

        .card span {
            display: inline-block;
            animation: pop .7s cubic-bezier(.2, .9, .3, 1.4)
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(24px) scale(.85) rotate(-2deg)
            }
        }

        .dots {
            display: flex;
            gap: 8px;
            margin-top: 22px
        }

        .dots i {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .3);
            transition: all .4s
        }

        .dots i.a {
            background: var(--pink);
            width: 26px;
            border-radius: 6px
        }

        .row {
            position: relative;
            display: flex;
            gap: 18px;
            align-items: center;
            justify-content: center;
            margin-top: 34px;
            min-height: 70px
        }

        #yes {
            margin: 0;
            transition: transform .3s
        }

        #no {
            margin: 0;
            background: rgba(255, 255, 255, .15);
            box-shadow: none;
            position: relative;
            transition: left .25s, top .25s, transform .25s
        }

        .place {
            margin-top: 22px;
            padding: 20px 24px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .25);
            backdrop-filter: blur(14px);
            max-width: 420px
        }

        .place b {
            font-size: 1.4rem;
            color: var(--pink)
        }

        .place div {
            margin-top: 6px;
            color: var(--soft)
        }

        a.btn {
            display: inline-block;
            text-decoration: none
        }

        canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9
        }
    </style>
</head>

<body>
    <div id="hearts"></div>

    <section class="scene on" id="s0">
        <div class="big">💌</div>
        <h1 style="margin-top:10px">Софа, привет!</h1>
        <p class="sub">У меня для тебя кое-что есть…</p>
        <button class="btn" id="start">Открыть ✨</button>
    </section>

    <section class="scene" id="s1">
        <div class="card" id="card"></div>
        <div class="dots" id="dots"></div>
        <button class="btn" id="next">Дальше →</button>
    </section>

    <section class="scene" id="s2">
        <div class="big">🥺</div>
        <h1 style="margin-top:10px">Софа, пойдём со мной на свидание?</h1>
        <p class="sub">Обещаю вкусную пасту и отличное настроение 🍝</p>
        <div class="row" id="row">
            <button class="btn" id="yes">Да! 💖</button>
            <button class="btn" id="no">Нет</button>
        </div>
    </section>

    <section class="scene" id="s3">
        <h1 style="margin-top:10px">Я знал, что ты согласишься 💕</h1>
        <div class="place">
            <b>Pasteria 🍝</b>
            <div>Проспект Аль-Фараби, 32, Костанай</div>
            <div style="margin-top:10px;font-size:1.3rem;color:#fff">📅 Четверг, 17:00</div>
        </div>
        <a class="btn" target="_blank" rel="noopener"
            href="https://2gis.kz/kostanaj/firm/70000001096790924?m=63.641747%2C53.209776%2F16">Открыть в 2ГИС 📍</a>
        <a class="btn" id="reply" target="_blank" rel="noopener" href="#" style="margin-top:14px">Ответить мне 💬</a>
    </section>

    <canvas id="cv"></canvas>

    <script>
        const TG = 'Teych_Man';
        const $ = id => document.getElementById(id);
        const scenes = [...document.querySelectorAll('.scene')];
        function go(n) { scenes.forEach((s, i) => s.classList.toggle('on', i === n)) }

        // floating hearts
        const H = ['💖', '💗', '💕', '✨', '🌸', '💘'];
        setInterval(() => {
            const e = document.createElement('div'); e.className = 'h';
            e.textContent = H[Math.random() * H.length | 0];
            e.style.left = Math.random() * 100 + 'vw';
            e.style.fontSize = (14 + Math.random() * 26) + 'px';
            e.style.animationDuration = (6 + Math.random() * 7) + 's';
            $('hearts').appendChild(e); setTimeout(() => e.remove(), 14000);
        }, 350);

        // compliments
        const C = [
            'А ты знала, что Весы и Овны хорошо сочетаются 😊',
            'Твои голосовые можно слушать бесконечно 😍',
            'Твой смех — мой любимый звук ✨',
            'Твой стиль заставляет сердце биться быстрее 🌸',
            'С тобой хочется быть лучше и просто быть рядом 💫',
            'Ты настоящая находка, Софа 💖'
        ];
        let i = 0;
        $('dots').innerHTML = C.map(() => '<i></i>').join('');
        function show() {
            $('card').innerHTML = '<span>' + C[i] + '</span>';
            [...$('dots').children].forEach((d, k) => d.classList.toggle('a', k === i));
            $('next').textContent = i === C.length - 1 ? 'И ещё один вопрос… 💌' : 'Дальше →';
        }
        $('start').onclick = () => { go(1); show() };
        $('next').onclick = () => { if (i < C.length - 1) { i++; show() } else go(2) };

        // the “No” button that can’t be pressed
        const no = $('no'), yes = $('yes');
        const L = ['Нет', 'Ты уверена? 🥺', 'Подумай ещё 😏', 'Не получится 😄', 'Даже не пытайся ✨', 'Ну пожалуйста 🥹', 'Кнопка сломалась 🙈'];
        let tries = 0, scale = 1;
        function dodge(e) {
            if (e && e.cancelable) e.preventDefault();
            tries++; scale = Math.min(scale + .18, 3.2);
            yes.style.transform = 'scale(' + scale + ')';
            no.textContent = L[tries % L.length];
            const r = no.getBoundingClientRect(), m = 16;
            const dx = (Math.random() - .5) * Math.min(innerWidth - r.width - 2 * m, 420);
            const dy = (Math.random() - .5) * Math.min(innerHeight * .5, 320);
            no.style.left = dx + 'px'; no.style.top = dy + 'px';
            no.style.transform = 'rotate(' + ((Math.random() - .5) * 30) + 'deg) scale(' + Math.max(.6, 1 - tries * .04) + ')';
        }
        ['mouseenter', 'touchstart', 'pointerdown', 'focus'].forEach(t => no.addEventListener(t, dodge, { passive: false }));
        no.addEventListener('click', e => { e.preventDefault(); dodge(e) });

        // confetti
        const cv = $('cv'), x = cv.getContext('2d'); let P = [];
        function fit() { cv.width = innerWidth; cv.height = innerHeight } fit(); addEventListener('resize', fit);
        function boom() {
            const col = ['#ff5c9d', '#ffd1e6', '#ff8a5c', '#fff', '#c77dff'];
            for (let k = 0; k < 220; k++)P.push({ x: innerWidth / 2, y: innerHeight / 2, vx: (Math.random() - .5) * 18, vy: Math.random() * -16 - 3, s: 4 + Math.random() * 7, c: col[Math.random() * 5 | 0], r: Math.random() * 6, l: 160 });
        }
        (function loop() {
            x.clearRect(0, 0, cv.width, cv.height);
            P = P.filter(p => p.l-->0);
            P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.r += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.min(1, p.l / 40); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); x.restore() });
            requestAnimationFrame(loop);
        })();
        yes.onclick = () => {
            go(3); boom();
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            $('reply').href = 'https://t.me/' + TG + '?text=' + encodeURIComponent('Да, я согласна! Четверг в 17:00, Pasteria 💖'); setTimeout(boom, 500); setTimeout(boom, 1100)
        };
    </script>
</body>

</html>
